<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><script src="/i18n.js"></script><title>Brickwire Paint</title>
<style>
*{box-sizing:border-box}body{margin:0;font:12px/1.3 system-ui,Segoe UI,sans-serif;background:#0e0f12;color:#d7d9de;display:grid;grid-template:40px 1fr/150px 1fr 200px;height:100vh}
header{grid-column:1/4;display:flex;gap:6px;align-items:center;padding:0 10px;background:#15171c;border-bottom:1px solid #23262d}
header b{color:#fff;margin-right:8px}button,select,input{background:#1d2027;color:#d7d9de;border:1px solid #2c3039;border-radius:5px;padding:4px 7px;font:inherit}
button:hover{background:#262a33;cursor:pointer}button.on,button.pri{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
#tools,#side{background:#13151a;padding:8px;overflow:auto}#tools{border-right:1px solid #23262d;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
#side{border-left:1px solid #23262d}#wrap{display:flex;align-items:center;justify-content:center;overflow:auto;background:repeating-conic-gradient(#121318 0 25%,#0f1014 0 50%) 0 0/20px 20px}
#view{position:relative}#view canvas{position:absolute;left:0;top:0}.layer{display:flex;gap:4px;align-items:center;padding:3px;border-radius:4px;cursor:pointer}.layer.sel{background:#2b3a6b}
label{display:block;margin:6px 0 2px;color:#8a8f9a}#log{position:fixed;left:160px;bottom:8px;background:#15171c;border:1px solid #2c3039;padding:6px 9px;border-radius:6px;display:none;max-width:60vw}
/* Application workspace sizing; keep original tools and data model. */
body{grid-template:auto minmax(0,1fr)/190px minmax(0,1fr) 220px;overflow:hidden;font-size:14px}
header{flex-wrap:wrap;padding:8px;gap:8px}button,select,input{min-height:44px}#tools button{min-height:44px;white-space:normal;overflow-wrap:anywhere;min-width:0}#tools{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#side input:not([type=checkbox]):not([type=color]){max-width:100%;width:100%}#side input[type=checkbox]{min-height:18px}#log{left:16px;max-width:calc(100vw - 32px);z-index:30}#view{flex-shrink:0}
@media(max-width:600px){body{grid-template: auto auto minmax(220px,1fr) auto/1fr;height:100vh;overflow:auto}header{grid-column:1}#tools{grid-column:1;grid-row:2;grid-template-columns:repeat(4,minmax(0,1fr));max-height:220px;overflow:auto}#wrap{grid-row:3;min-height:220px}#side{grid-row:4;border-top:1px solid #23262d}header span{display:none}}
</style><style>
:root{color-scheme:dark}body{background:#0d141c;color:#e1edf6;font:14px/1.45 system-ui,sans-serif}header{background:linear-gradient(120deg,#263847,#172633);border-bottom:1px solid #4b6579;box-shadow:0 2px 0 #080f17;padding:10px;gap:8px}button,input,select,textarea{border-radius:6px;background:#152431;color:#dcecf7;border:1px solid #486278;min-height:38px;font:13px/1.4 system-ui,sans-serif;box-shadow:inset 0 1px 0 #fff08,0 2px 0 #090f16}button.on,button.pri{background:linear-gradient(#a9dcfc,#78bce8);color:#102c40;border-color:#c3e6fe;box-shadow:inset 0 1px 0 #fff8,0 3px 0 #35526b}button:hover{background:#355269;color:#fff}#tools,#left,#layers,#props,#side,aside{background:#15212c;color:#c0d0dd;border-color:#42596c}#wrap{background-color:#0b151e}#stage{background:#192835;box-shadow:0 2px 0 #080e15,0 12px 28px #0004;border:1px solid #344e62}.layer.sel{background:#29485f}.layer{padding:7px}.layer input{accent-color:#82c8f4}input[type=checkbox]{width:18px!important;height:18px!important;min-height:18px!important}input[type=range]{box-shadow:none;accent-color:#86cbf5}label{color:#b4c8d8}dialog{background:#1a2b3a;border:1px solid #6f8ba2;color:#e5f1fa;border-radius:10px}dialog::backdrop{background:#020810b8}:focus-visible{outline:2px solid #9ad9ff;outline-offset:3px}
</style><style>
:root{--editor-bg:#10130d;--editor-surface:#1a1e14;--editor-line:#414832;--editor-accent:#e5f65a;color-scheme:dark}
body{background:var(--editor-bg);color:#eeeeda}header{background:#181c12;border-color:var(--editor-line);box-shadow:none}
header b,h4{color:#f3efda}button,input,select,textarea{background:#24291b;border-color:var(--editor-line);color:#e4e8d4;box-shadow:none}
button.on,button.pri{background:var(--editor-accent);color:#171e09;border-color:var(--editor-accent);box-shadow:none}button:hover{background:#343d23;color:#f3efda}
#tools,#layers,#props,#side,aside{background:var(--editor-surface);color:#c2c7b4;border-color:var(--editor-line)}#wrap,#stageWrap{background:repeating-conic-gradient(#151a11 0 25%,#10150d 0 50%) 0 0/20px 20px}
#stage{background:#1c2216;box-shadow:none;border-color:#464e38}.layer.sel{background:#e5f65a22}.el.sel{outline-color:var(--editor-accent)}.h{background:var(--editor-accent)}label{color:#b6beaa}input[type=range],input[type=checkbox]{accent-color:var(--editor-accent)}dialog{background:#202719;border-color:var(--editor-line);color:#eeeeda}:focus-visible{outline:2px solid var(--editor-accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header><b> Paint</b>
<select id="size" data-bwh="0"><option value="1920x1080">1920×1080</option><option value="1280x720">1280×720</option><option value="512x512">512×512</option><option value="1024x1024">1024×1024</option></select>
<button data-bwh="1">↶ Undo</button><button data-bwh="2">↷ Redo</button>
<span style="flex:1"></span>
<button data-bwh="3">Открыть</button><button data-bwh="4">PNG</button>
<button class="pri" data-bwh="5">Отправить в чат</button><button id="bwClose" style="display:none" title="Свернуть (рисунок сохранится)"></button></header>
<div id="tools"></div><div id="wrap"><div id="view"></div></div>
<div id="side"><label>Цвет</label><input type="color" id="color" value="#ffcc00"> <input type="color" id="color2" value="#000000" title="второй цвет / обводка">
<label>Размер <span id="sv">12</span></label><input type="range" id="bsize" min="1" max="200" value="12" data-bwh="6">
<label>Непрозрачность</label><input type="range" id="alpha" min="5" max="100" value="100">
<label>Текст</label><input id="txt" value="+999999">
<h4>Слои</h4><div id="layers"></div>
<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap"><button data-bwh="7">+ Слой</button><button data-bwh="8">Удалить</button><button data-bwh="9">↑</button><button data-bwh="10">↓</button><button data-bwh="11">Слить вниз</button></div>
<label><input type="checkbox" id="chatAttach" checked> прикреплять картинкой (иначе текст)</label></div>
<div id="log"></div>
<script src="paint.js"></script></body></html>
