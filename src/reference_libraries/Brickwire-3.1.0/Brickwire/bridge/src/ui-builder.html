<script>
let doc={name:"MainMenu",children:[]},sel=null,uid=0;
const $=s=>document.querySelector(s),stage=$("#stage");
const defs={Frame:{bg:"#2a2f3a",corner:8},Text:{text:"Text",textColor:"#ffffff",textSize:24,bgTransparency:1},Button:{text:"Play",bg:"#3b5bdb",textColor:"#ffffff",textSize:22,corner:10,states:{hover:{scale:1.05},pressed:{scale:0.95}}},Image:{image:"rbxassetid://0",bgTransparency:1},Input:{placeholder:"Type...",bg:"#1f232b",textColor:"#ffffff",textSize:18,corner:6},Scroll:{bg:"#20242c",list:{direction:"Vertical",padding:6}}};
function walk(list,f,parent=null){for(const e of list){f(e,parent);if(e.children)walk(e.children,f,e)}}
function parentOf(t){let p=null;walk(doc.children,(e,par)=>{if(e===t)p=par});return p}
function listOf(t){const p=parentOf(t);return p?p.children:doc.children}
function addEl(inside){const t=$("#addType").value;const e={type:t,name:t+(++uid),position:[0.35,0,0.4,0],size:[0.3,0,0.15,0],...JSON.parse(JSON.stringify(defs[t]))};
 if(inside&&sel){(sel.children=sel.children||[]).push(e);e.position=[0.1,0,0.1,0];e.size=[0.8,0,0.3,0]}else doc.children.push(e);sel=e;render()}
function dup(){if(!sel)return;const c=JSON.parse(JSON.stringify(sel));c.name+="_copy";c.position=[sel.position[0]+0.02,0,sel.position[2]+0.02,0];listOf(sel).push(c);sel=c;render()}
function del(){if(!sel)return;const l=listOf(sel);l.splice(l.indexOf(sel),1);sel=null;render()}
function draw(list,host){for(const e of list){const d=document.createElement("div");d.className="el"+(e===sel?" sel":"");const p=e.position||[0,0,0,0],s=e.size||[0,100,0,100];
 d.style.left=`calc(${p[0]*100}% + ${p[1]}px)`;d.style.top=`calc(${p[2]*100}% + ${p[3]}px)`;d.style.width=`calc(${s[0]*100}% + ${s[1]}px)`;d.style.height=`calc(${s[2]*100}% + ${s[3]}px)`;
 const tr=e.bgTransparency??0;d.style.background=tr>=1?"transparent":(e.bg||"#ffffff");d.style.opacity=1;if(tr>0&&tr<1)d.style.background=hexA(e.bg||"#fff",1-tr);
 d.style.borderRadius=(typeof e.corner==="number"?e.corner/2:0)+"px";if(e.stroke)d.style.border=`${(e.stroke.thickness||1)/2}px solid ${e.stroke.color||"#fff"}`;
 d.style.color=e.textColor||"#fff";d.style.fontSize=((e.textSize||18)/2)+"px";d.style.fontWeight=600;
 if(e.type==="Image"){d.textContent=" "+(e.image||"");d.style.outline="1px dashed #555"}else d.textContent=e.text??(e.placeholder?e.placeholder:"");
 if(e.type==="Input")d.style.color="#888";
 d.onmousedown=ev=>{ev.stopPropagation();sel=e;render();startDrag(ev,e,host,false)};
 if(e===sel){const h=document.createElement("div");h.className="h";h.onmousedown=ev=>{ev.stopPropagation();startDrag(ev,e,host,true)};d.appendChild(h)}
 host.appendChild(d);if(e.children)draw(e.children,d)}}
function hexA(h,a){h=h.replace("#","");const n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function startDrag(ev,e,host,resize){const r=host.getBoundingClientRect(),x0=ev.clientX,y0=ev.clientY,p0=[...e.position],s0=[...e.size];
 const mv=m=>{const dx=(m.clientX-x0)/r.width,dy=(m.clientY-y0)/r.height,snap=v=>Math.round(v*200)/200;
  if(resize){e.size=[Math.max(0.01,snap(s0[0]+dx)),s0[1],Math.max(0.01,snap(s0[2]+dy)),s0[3]]}else{e.position=[snap(p0[0]+dx),p0[1],snap(p0[2]+dy),p0[3]]}render(true)};
 const up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up);render()};addEventListener("mousemove",mv);addEventListener("mouseup",up)}
function render(fast){stage.innerHTML="";draw(doc.children,stage);if(fast)return;
 const L=$("#layers");L.innerHTML="<h4>Слои</h4>";const add=(list,dep)=>{for(const e of list){const d=document.createElement("div");d.className="layer"+(e===sel?" sel":"");d.style.paddingLeft=6+dep*12+"px";d.textContent=`${e.type||e.component} · ${e.name}`;d.onclick=()=>{sel=e;render()};L.appendChild(d);if(e.children)add(e.children,dep+1)}};add(doc.children,0);
 const P=$("#props");if(!sel){P.innerHTML="<h4>Свойства</h4><div style='color:#777'>Выбери элемент</div>";return}
 const f=(k,label,type="text")=>`<label>${label}</label><input data-k="${k}" type="${type}" value="${String(sel[k]??"").replace(/"/g,"&quot;")}">`;
 const u=(k,label)=>`<label>${label} (scale x, px x, scale y, px y)</label><div class="row">${[0,1,2,3].map(i=>`<input data-u="${k}" data-i="${i}" type="number" step="0.01" value="${(sel[k]||[0,0,0,0])[i]}">`).join("")}</div>`;
 P.innerHTML="<h4>Свойства</h4>"+f("name","Name")+`<label>Type</label><select data-k="type">${Object.keys(defs).map(t=>`<option ${t===sel.type?"selected":""}>${t}</option>`).join("")}</select>`+
  u("position","Position")+u("size","Size")+f("bg","Background","color")+f("bgTransparency","BG transparency 0..1","number")+f("corner","Corner px","number")+
  (sel.type==="Image"?f("image","Image id"):f("text","Text")+f("textColor","Text color","color")+f("textSize","Text size","number"))+(sel.type==="Input"?f("placeholder","Placeholder"):"")+
  `<label>Появление</label><select data-k="appear"><option value="">нет</option>${["fade","pop","slide"].map(a=>`<option ${a===sel.appear?"selected":""}>${a}</option>`).join("")}</select>`+
  `<label>Hover/press анимация</label><select data-k="_states"><option value="0">нет</option><option value="1" ${sel.states?"selected":""}>scale 1.05 / 0.95</option></select>`+
  `<label>Раскладка детей</label><select data-k="_list"><option value="">свободная</option><option ${sel.list?.direction==="Vertical"?"selected":""}>Vertical</option><option ${sel.list?.direction==="Horizontal"?"selected":""}>Horizontal</option></select>`;
 P.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>{const k=i.dataset.k,v=i.value;
  if(k==="_states")sel.states=v==="1"?{hover:{scale:1.05},pressed:{scale:0.95}}:undefined;else if(k==="_list")sel.list=v?{direction:v,padding:6}:undefined;
  else if(k==="appear")sel.appear=v||undefined;else sel[k]=i.type==="number"?(v===""?undefined:Number(v)):v;render()});
 P.querySelectorAll("[data-u]").forEach(i=>i.onchange=()=>{const a=[...(sel[i.dataset.u]||[0,0,0,0])];a[+i.dataset.i]=Number(i.value);sel[i.dataset.u]=a;render()})}
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?undefined:v))}
function currentDoc(){doc.name=$("#guiName").value||"MainMenu";return clean(doc)}
function log(t){const l=$("#log");l.style.display="block";l.textContent=t;clearTimeout(log.t);log.t=setTimeout(()=>l.style.display="none",9000)}
function exportJson(){const s=JSON.stringify(currentDoc(),null,2);navigator.clipboard?.writeText(s);log("JSON скопирован в буфер:\n"+s.slice(0,600))}
function importJson(){const s=prompt("Вставь UIDoc JSON");if(!s)return;try{load(JSON.parse(s))}catch(e){log("Ошибка JSON: "+e.message)}}
function load(d){if(!d||!Array.isArray(d.children))throw new Error("нет children");doc=d;$("#guiName").value=d.name||"MainMenu";sel=null;render()}
async function call(tool,args){const id="ui_"+Date.now().toString(36);
 let r=await (await fetch("/api/calls",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({call:{id,tool,args},provider:"app-workspace",waitMs:20000})})).json();
 for(let i=0;i<20&&r&&!r.result&&r.state!=="failed";i++){if(r.state==="pending_approval"){log("Ожидает вашего подтверждения: "+tool);const approve=confirm("Brickwire / "+tool+"\n"+(r.approvalReason||"")+"\n"+JSON.stringify(args).slice(0,1500)+"\nРазрешить именно эту операцию?");await fetch("/api/approvals/"+encodeURIComponent(r.approvalId),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({approve})});}r=await (await fetch(`/api/calls/${encodeURIComponent(r.callId||id)}?wait=15000`)).json()}
 const res=r?.result;if(!res)throw new Error(r?.error||"нет ответа от bridge (Studio подключена?)");if(res.status!=="success")throw new Error(res.error||res.status);return res.result}
async function toStudio(){try{log("Собираю в Studio…");const r=await call("ui_build",{doc:currentDoc(),replaceExisting:true});log("Результат инструмента (визуальная проверка отдельно): "+JSON.stringify(r).slice(0,500))}catch(e){log("Ошибка: "+e.message)}}
async function fromStudio(){const p=prompt("Путь к ScreenGui","game.StarterGui."+($("#guiName").value||"MainMenu"));if(!p)return;try{const r=await call("ui_import",{path:p});load(r.doc||r);log("Импортировано из Studio")}catch(e){log("Ошибка: "+e.message)}}
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="Delete")del();if(e.ctrlKey&&e.key==="d"){e.preventDefault();dup()}});
// M6: frame presets (stage keeps 16:9-ish preview, aspect follows the preset) + thumbnail PNG export at exactly 1920x1080.
let frame={w:1920,h:1080,thumb:false};
function setFrame(v){if(v==="thumb"){frame={w:1920,h:1080,thumb:true}}else{const[a,b]=v.split("x").map(Number);frame={w:a,h:b,thumb:false}}
 const k=Math.min(960/frame.w,540/frame.h);stage.style.width=Math.round(frame.w*k)+"px";stage.style.height=Math.round(frame.h*k)+"px";render();fitStage()}
function fitStage(){const wrap=$("#stageWrap");const k=Math.max(.01,Math.min((wrap.clientWidth-24)/(stage.clientWidth||960),(wrap.clientHeight-24)/(stage.clientHeight||540),1));stage.style.transform="scale("+k+")";}
new ResizeObserver(fitStage).observe($("#stageWrap"));addEventListener("resize",fitStage);
function rectOf(e,px,py,pw,ph){const p=e.position||[0,0,0,0],s=e.size||[0,100,0,100],k=pw/ (stage.clientWidth||960);
 return{x:px+p[0]*pw+p[1]*k*2,y:py+p[2]*ph+p[3]*k*2,w:s[0]*pw+s[1]*k*2,h:s[2]*ph+s[3]*k*2}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function paintList(c,list,px,py,pw,ph,W){for(const e of list){const R=rectOf(e,px,py,pw,ph),tr=e.bgTransparency??0,sc=W/1920;
  if(tr<1){c.globalAlpha=1-tr;c.fillStyle=e.bg||"#ffffff";rr(c,R.x,R.y,R.w,R.h,(e.corner||0)*sc);c.fill();c.globalAlpha=1}
  if(e.stroke){c.lineWidth=(e.stroke.thickness||1)*sc;c.strokeStyle=e.stroke.color||"#fff";rr(c,R.x,R.y,R.w,R.h,(e.corner||0)*sc);c.stroke()}
  const t=e.type==="Image"?"":(e.text??"");if(t){const fs=(e.textSize||18)*sc;c.font=`800 ${fs}px "Fredoka One","Arial Black",system-ui`;c.textAlign="center";c.textBaseline="middle";
   if(frame.thumb){c.lineJoin="round";c.lineWidth=Math.max(4,fs*0.18);c.strokeStyle="#000";c.strokeText(t,R.x+R.w/2,R.y+R.h/2)}
   c.fillStyle=e.textColor||"#fff";c.fillText(t,R.x+R.w/2,R.y+R.h/2)}
  if(e.children)paintList(c,e.children,R.x,R.y,R.w,R.h,W)}}
function exportPng(){const W=1920,H=1080,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
 c.fillStyle="#1b1e24";c.fillRect(0,0,W,H);paintList(c,currentDoc().children,0,0,W,H,W);
 cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(($("#guiName").value)||"ui")+"-1920x1080.png";a.click();log(`PNG ${cv.width}×${cv.height} сохранён`)},"image/png")}
stage.onmousedown=()=>{sel=null;render()};
// ===== M6 (2.2): components, auto-layout, constraints, asset library, in-canvas AI, two-way sync =====
let editMaster=null,base=null,builtins={};
fetch("/ui-builder/components.json").then(r=>r.json()).then(j=>{builtins=j||{};fillComps();render()}).catch(()=>{});
function comps(){return doc.components||(doc.components={})}
function allComps(){return{...builtins,...comps()}}
function rootList(){return editMaster?[comps()[editMaster]]:doc.children}
function walk2(list,f,parent=null){for(const e of list){if(!e)continue;f(e,parent);if(e.children)walk2(e.children,f,e)}}
parentOf=function(t){let p=null;walk2(rootList(),(e,par)=>{if(e===t)p=par});return p};
listOf=function(t){const p=parentOf(t);return p?p.children:rootList()};
/** instance -> resolved element (master + variant + overrides). Editing the master updates every instance. */
function resolve(e){if(!e.component)return e;const def=allComps()[e.component];if(!def)return{...e,type:"Frame",bg:"#5a1d1d",text:"? "+e.component};
 const b=JSON.parse(JSON.stringify(def));const vars=b.variants;delete b.variants;delete b.description;if(e.variant&&vars&&vars[e.variant])Object.assign(b,vars[e.variant]);
 const{component,variant,children,...ov}=e;const r={...b,...ov};r.children=[...(b.children||[]),...(children||[])];return r}
const JX={Left:"flex-start",Center:"center",Right:"flex-end",Top:"flex-start",Bottom:"flex-end"};
function px(u,i){return u&&u.length===4?`calc(${u[i]*100}% + ${u[i+1]/2}px)`:"0px"}
draw=function(list,host,parentR,inInst){for(const raw of list){if(!raw)continue;const e=resolve(raw),inst=!!raw.component||inInst;const d=document.createElement("div");d.className="el"+(raw===sel?" sel":"");
 const s=e.size||[0,100,0,100],flow=parentR&&(parentR.list||parentR.grid);
 if(flow){d.style.position="relative";d.style.flex="0 0 auto";if(!parentR.grid){d.style.width=px(s,0);d.style.height=px(s,2)}}
 else{d.style.left=px(e.position||[0,0,0,0],0);d.style.top=px(e.position||[0,0,0,0],2);d.style.width=px(s,0);d.style.height=px(s,2);
  const a=e.anchor||[0,0];if(a[0]||a[1])d.style.transform=`translate(${-a[0]*100}%,${-a[1]*100}%)`}
 if(e.aspect){d.style.aspectRatio=String(e.aspect);if(!flow||!parentR.grid)d.style.height="auto"}
